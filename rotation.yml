name: Rotation sectorielle

on:
  schedule:
    # 22h00 Paris en heure d'été (UTC+2) = 20h00 UTC — du lundi au vendredi.
    # En heure d'hiver (UTC+1), ce cron tombe à 21h00 Paris.
    - cron: "0 20 * * 1-5"
  workflow_dispatch:          # bouton "Run workflow" pour un lancement manuel

permissions:
  contents: write             # commit des rapports

jobs:
  rotation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Dépendances
        run: pip install yfinance pandas numpy

      - name: Rotation FR
        id: fr
        continue-on-error: true   # un marché en échec n'empêche pas l'autre
        run: python rotation_fr.py

      - name: Rotation US
        id: us
        continue-on-error: true
        run: python rotation_us.py

      - name: Commit des rapports
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A                     # alert_*.txt est exclu par .gitignore
          if git diff --staged --quiet; then
            echo "Rien à committer"
          else
            git commit -m "rotation: $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Alertes Telegram
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::Secrets TELEGRAM_TOKEN / TELEGRAM_CHAT_ID absents : pas d'envoi."
            exit 0
          fi
          for m in fr us; do
            [ -f "alert_$m.txt" ] || continue
            text="$(cat alert_$m.txt)

          Rapport : https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/rotation_$m.md"
            curl -sS --fail -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${text}" \
              --data-urlencode "disable_web_page_preview=true" > /dev/null
            echo "Alerte $m envoyée"
          done

      - name: Échec signalé
        if: steps.fr.outcome == 'failure' || steps.us.outcome == 'failure'
        run: |
          echo "FR : ${{ steps.fr.outcome }} — US : ${{ steps.us.outcome }} (voir le log de l'étape en échec)"
          exit 1
